version: "3.8"
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-restdb_proxy}
      - MYSQL_USER=${MYSQL_USER:-restdb_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=${PMA_HOST:-mariadb}
      - PMA_USER=${PMA_USER:-root}
      - PMA_PASSWORD=${PMA_PASSWORD}
    depends_on:
      - mariadb

  proxy:
    build: .
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      - ../.env
    environment:
      - PROXY_API_KEY_FILE=/secrets/db_key.txt
      - PROXY_READONLY_API_KEY_FILE=/secrets/readonly_key.txt
      - DATABASE_URL=${DATABASE_URL}
      - DB_USER=${DB_USER:-restdb_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-restdb_proxy}
    depends_on:
      - mariadb
    volumes:
      - ../.env/secrets:/secrets:ro

volumes:
  mariadb_data:
