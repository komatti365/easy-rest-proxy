version: "3.8"
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=restdb_proxy
      - MYSQL_USER=restdb_user
      - MYSQL_PASSWORD=restdb_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_pass"]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=root_pass
    depends_on:
      - mariadb

  proxy:
    build: .
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file:
      - .env
    environment:
      - PROXY_API_KEY=${PROXY_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - DB_USER=${DB_USER:-restdb_user}
      - DB_PASSWORD=${DB_PASSWORD:-restdb_pass}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-restdb_proxy}

volumes:
  mariadb_data:
