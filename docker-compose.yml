version: "3.8"

secrets:
  mysql_root_password:
    file: /opt/selfdev/secret/mysql_root_password.txt
  db_name:
    file: /opt/selfdev/secret/db_name.txt
  db_user:
    file: /opt/selfdev/secret/db_user.txt
  db_password:
    file: /opt/selfdev/secret/db_password.txt
  proxy_api_key:
    file: /opt/selfdev/secret/shared_api_key.txt

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_DATABASE_FILE=/run/secrets/db_name
      - MYSQL_USER_FILE=/run/secrets/db_user
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - mysql_root_password
      - db_name
      - db_user
      - db_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD_FILE=/run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    depends_on:
      - mariadb

  proxy:
    build: .
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - PROXY_API_KEY_FILE=/run/secrets/proxy_api_key
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME_FILE=/run/secrets/db_name
      - DB_HOST=mariadb
      - DB_PORT=3306
    secrets:
      - proxy_api_key
      - db_user
      - db_password
      - db_name
    depends_on:
      - mariadb

volumes:
  mariadb_data:
